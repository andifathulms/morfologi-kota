<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Bentuk Kota">
  <!--
    The mark is the instrument: a fixed-radius sample disc with street ink in
    it, drawn from the same tokens as everything else (DESIGN.md §3, §5). Ink
    hairlines on plate, a hairline at the sampling boundary, no colour — the
    two hues carry the drive/walk gap and nothing else, least of all a logo.

    The crossing sits off-centre because a real sample is not centred on an
    intersection, and because a centred cross reads as a target rather than as
    a street network.
  -->
  <defs>
    <clipPath id="disc"><circle cx="16" cy="16" r="14.5"/></clipPath>
  </defs>
  <circle cx="16" cy="16" r="14.5" fill="#F7F4EC"/>
  <g clip-path="url(#disc)" stroke="#16140F" stroke-width="2.4" stroke-linecap="square">
    <path d="M0 12.5h32"/>
    <path d="M0 24h32"/>
    <path d="M12.5 0v32"/>
    <path d="M24 0v32"/>
  </g>
  <circle cx="16" cy="16" r="14.5" fill="none" stroke="#B5AE9F" stroke-width="1.4"/>
</svg>
